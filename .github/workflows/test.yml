name: Python Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pilot and calibration tests use Python's standard library only.
      # QuTiP/Matplotlib/NumPy/Pandas remain optional for separate experiments.
      - name: Run tests
        run: python -m unittest discover -s tests -v
