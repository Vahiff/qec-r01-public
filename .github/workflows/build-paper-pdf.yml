name: Build paper PDF
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra biber
      - name: Compile PDF
        run: |
          cd paper
          pdflatex -interaction=nonstopmode main.tex || true
          biber main || true
          pdflatex -interaction=nonstopmode main.tex || true
          pdflatex -interaction=nonstopmode main.tex || true
          if [ -f SI.tex ]; then
            pdflatex -interaction=nonstopmode SI.tex || true
            pdflatex -interaction=nonstopmode SI.tex || true
          fi
      - name: Commit and Push PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "automated: rebuild PDF"
          file_pattern: 'paper/*.pdf'
