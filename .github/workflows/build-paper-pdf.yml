name: QEC-R01 verified Python and paper build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-paper-pdf.yml'
      - 'paper/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/build-paper-pdf.yml'
      - 'paper/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Install LaTeX, BibLaTeX and Biber
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-fonts-recommended biber cm-super lmodern
      - name: Compile paper (fail on any error)
        shell: bash
        working-directory: paper
        run: |
          set -euo pipefail
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          biber main
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          if [ -f SI.tex ]; then
            pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error SI.tex
            pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error SI.tex
            test -s SI.pdf
          fi
      - name: Publish build artifacts without mutating main
        uses: actions/upload-artifact@v4
        with:
          name: qec-r01-paper-${{ github.sha }}
          path: |
            paper/main.pdf
            paper/SI.pdf
          if-no-files-found: error
          retention-days: 30
