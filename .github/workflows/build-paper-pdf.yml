name: Build paper PDF
on:
  push:
    branches: [main]
    paths:
      - paper/main.tex
      - paper/references.bib
      - paper/figures/**
      - .github/workflows/build-paper-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-pdf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX and Biber
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-recommended texlive-fonts-recommended texlive-bibtex-extra biber
      - name: Build manuscript (no shell escape)
        working-directory: paper
        run: |
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex
          biber main
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | grep Pages
      - name: Commit PDF to same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/main.pdf
          if git diff --cached --quiet; then
            echo 'PDF unchanged'
          else
            git commit -m 'paper: regenerate PDF from reviewed LaTeX'
            git push origin HEAD:main
          fi
